<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>NYCKING — 语音翻译</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface2: #222;
      --accent: #f97316;
      --accent2: #fb923c;
      --accent-glow: rgba(249,115,22,0.25);
      --text: #f0f0f0;
      --text-dim: #777;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #eab308;
      --radius: 14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .screen { display:none; flex-direction:column; min-height:100dvh; }
    .screen.active { display:flex; }

    /* ===== PIN GATE ===== */
    #pin-screen {
      align-items:center; justify-content:center; gap:24px;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    }
    .pin-icon { font-size:48px; }
    .pin-title { font-size:22px; font-weight:700; }
    .pin-subtitle { font-size:14px; color:var(--text-dim); }
    .pin-dots { display:flex; gap:10px; margin:8px 0; }
    .pin-dot {
      width:14px; height:14px; border-radius:50%;
      border:2px solid var(--text-dim); transition:all .2s;
    }
    .pin-dot.filled { background:var(--accent); border-color:var(--accent); }
    .pin-dot.error { background:var(--error); border-color:var(--error); }
    .pin-pad { display:grid; grid-template-columns:repeat(3,72px); gap:12px; }
    .pin-key {
      width:72px; height:56px; border-radius:12px;
      background:var(--surface2); border:1px solid #333;
      color:var(--text); font-size:22px; font-weight:600;
      cursor:pointer; transition:all .15s;
      display:flex; align-items:center; justify-content:center;
    }
    .pin-key:active { background:var(--accent); transform:scale(0.93); }
    .pin-key.fn { font-size:16px; background:transparent; border-color:transparent; }

    /* ===== TRANSLATOR ===== */
    #translator {
      padding: calc(env(safe-area-inset-top, 8px) + 8px) 16px calc(env(safe-area-inset-bottom, 8px) + 8px);
      gap: 10px;
      flex: 1;
    }

    /* Header */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 4px 0;
    }
    .logo { font-size:22px; font-weight:800; color:var(--accent); letter-spacing:1px; }
    .header-badge {
      font-size:11px; color:var(--text-dim); background:var(--surface);
      padding:4px 10px; border-radius:20px;
    }

    /* Language bar */
    .lang-bar {
      display:flex; align-items:center; gap:8px;
      background:var(--surface); border-radius:var(--radius);
      padding:10px 12px;
    }
    .lang-select {
      flex:1; background:var(--surface2); border:1px solid #333;
      color:var(--text); font-size:15px; font-weight:600;
      padding:10px 12px; border-radius:10px;
      appearance:none; cursor:pointer; text-align:center;
    }
    .lang-select:focus { outline:none; border-color:var(--accent); }
    .swap-btn {
      width:44px; height:44px; border-radius:50%;
      background:var(--accent); border:none; color:#fff;
      font-size:20px; cursor:pointer; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      transition:transform .3s;
    }
    .swap-btn:active { transform:rotate(180deg) scale(0.9); }

    /* Scene bar */
    .scene-bar {
      display:flex; gap:6px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:2px 0;
    }
    .scene-btn {
      flex-shrink:0; padding:7px 14px; border-radius:20px;
      background:var(--surface); border:1px solid #333;
      color:var(--text-dim); font-size:12px; font-weight:600;
      cursor:pointer; transition:all .2s; white-space:nowrap;
    }
    .scene-btn.active {
      background:var(--accent); border-color:var(--accent);
      color:#fff;
    }
    .scene-btn:active { transform:scale(0.95); }

    /* Text panels */
    .text-panel {
      background:var(--surface); border-radius:var(--radius);
      padding:14px 16px; flex:1; min-height:90px;
      display:flex; flex-direction:column; gap:8px;
      border:1px solid transparent; transition:border-color .3s;
    }
    .text-panel.active { border-color:var(--accent); }
    .panel-label {
      font-size:12px; font-weight:600; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:1px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .panel-text {
      font-size:18px; line-height:1.6; flex:1;
      overflow-y:auto; word-break:break-word;
    }
    .panel-text.placeholder { color:var(--text-dim); font-size:15px; }
    .panel-text.interim { color:var(--accent2); opacity:0.7; }
    .speak-btn {
      background:none; border:none; color:var(--accent);
      font-size:18px; cursor:pointer; padding:4px;
    }
    .speak-btn:active { opacity:0.6; }

    /* Mic section */
    .mic-section {
      display:flex; flex-direction:column; align-items:center;
      gap:8px; padding:6px 0;
    }
    .mic-btn {
      width:76px; height:76px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      border:none; color:#fff; font-size:34px;
      cursor:pointer; position:relative;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s; box-shadow:0 4px 20px var(--accent-glow);
    }
    .mic-btn:active { transform:scale(0.92); }
    .mic-btn.listening {
      background:linear-gradient(135deg, var(--error), #dc2626);
      box-shadow:0 4px 30px rgba(239,68,68,0.4);
      animation:pulse-mic 1.5s ease-in-out infinite;
    }
    .mic-btn:disabled { opacity:0.4; cursor:not-allowed; }
    @keyframes pulse-mic {
      0%,100%{box-shadow:0 4px 20px rgba(239,68,68,0.3);}
      50%{box-shadow:0 4px 40px rgba(239,68,68,0.6);}
    }
    .mic-label { font-size:13px; color:var(--text-dim); text-align:center; }

    /* Status */
    .status-bar {
      text-align:center; font-size:13px; padding:6px;
      border-radius:8px; transition:all .3s;
    }
    .status-bar.error { color:var(--error); background:rgba(239,68,68,0.1); }
    .status-bar.success { color:var(--success); background:rgba(34,197,94,0.1); }
    .status-bar.warning { color:var(--warning); background:rgba(234,179,8,0.1); }
    .status-bar.info { color:var(--accent); background:rgba(249,115,22,0.1); }
    .status-bar.listening { color:var(--error); background:rgba(239,68,68,0.1); }
    .status-bar:empty { display:none; }

    /* Controls */
    .controls {
      display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
      padding:4px 0;
    }
    .toggle-label {
      display:flex; align-items:center; gap:5px;
      font-size:12px; color:var(--text-dim); cursor:pointer;
    }
    .toggle-label input[type="checkbox"] {
      width:16px; height:16px; accent-color:var(--accent);
    }

    /* History */
    .history-section { margin-top:2px; }
    .history-header {
      font-size:12px; color:var(--text-dim); font-weight:600;
      text-transform:uppercase; letter-spacing:1px;
      padding:4px 0; display:flex; align-items:center; gap:6px;
    }
    .history-list {
      display:flex; flex-direction:column; gap:6px;
      max-height:180px; overflow-y:auto;
    }
    .history-item {
      background:var(--surface); border-radius:10px;
      padding:8px 12px; font-size:12px;
    }
    .history-source { color:var(--text-dim); margin-bottom:3px; }
    .history-target { color:var(--text); }

    /* Token cost badge */
    .cost-badge {
      position:fixed; bottom:env(safe-area-inset-bottom, 12px);
      right:12px; z-index:100;
      background:var(--surface); border:1px solid #333;
      border-radius:20px; padding:6px 12px;
      font-size:11px; color:var(--text-dim);
      display:flex; align-items:center; gap:4px;
      backdrop-filter:blur(8px);
    }
    .cost-badge .cost-val { color:var(--accent); font-weight:700; }

    /* Text input bar */
    .text-input-bar {
      display:flex; gap:8px;
      background:var(--surface); border-radius:var(--radius);
      padding:8px 10px;
    }
    .text-input-bar input {
      flex:1; background:var(--surface2); border:1px solid #333;
      color:var(--text); font-size:15px; padding:10px 12px;
      border-radius:10px; outline:none;
    }
    .text-input-bar input:focus { border-color:var(--accent); }
    .text-input-bar input::placeholder { color:var(--text-dim); }
    .send-btn {
      width:44px; height:44px; border-radius:50%;
      background:var(--accent); border:none; color:#fff;
      font-size:20px; cursor:pointer; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s;
    }
    .send-btn:active { transform:scale(0.9); }
    .send-btn:disabled { opacity:0.4; cursor:not-allowed; }

    /* Not supported warning */
    .not-supported {
      background:rgba(239,68,68,0.15); border:1px solid var(--error);
      border-radius:var(--radius); padding:16px;
      text-align:center; color:var(--error); font-size:14px;
    }

    /* Responsive */
    @media (min-width:600px) {
      #translator { max-width:500px; margin:0 auto; }
      .text-panels { display:flex; gap:12px; }
      .text-panels .text-panel { flex:1; min-height:160px; }
    }
  </style>
</head>
<body>

<!-- ===== PIN SCREEN ===== -->
<div id="pin-screen" class="screen active">
  <div class="pin-icon">🔐</div>
  <div class="pin-title">输入访问码 Enter PIN</div>
  <div class="pin-subtitle">请输入 6 位数字密码</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad" id="pin-pad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key fn" data-key="del">⌫</button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key fn" data-key="clear">C</button>
  </div>
</div>

<!-- ===== TRANSLATOR SCREEN ===== -->
<div id="translator" class="screen">
  <!-- Header -->
  <div class="header">
    <span class="logo">NYCKING</span>
    <span class="header-badge">Gemini 2.5 Flash</span>
  </div>

  <!-- Language bar -->
  <div class="lang-bar">
    <select id="source-lang" class="lang-select">
      <option value="zh-CN">🇨🇳 中文</option>
      <option value="en-US">🇺🇸 English</option>
      <option value="th-TH">🇹🇭 ไทย</option>
      <option value="lo-LA">🇱🇦 ລາວ</option>
    </select>
    <button id="swap-btn" class="swap-btn" title="交换语言">⇄</button>
    <select id="target-lang" class="lang-select">
      <option value="th-TH">🇹🇭 ไทย</option>
      <option value="en-US">🇺🇸 English</option>
      <option value="zh-CN">🇨🇳 中文</option>
      <option value="lo-LA">🇱🇦 ລາວ</option>
    </select>
  </div>

  <!-- Scene selector -->
  <div class="scene-bar" id="scene-bar">
    <button class="scene-btn active" data-scene="travel">✈️ 旅行休闲</button>
    <button class="scene-btn" data-scene="romance">💕 感情社交</button>
    <button class="scene-btn" data-scene="business">💼 商务会谈</button>
  </div>

  <!-- Text panels -->
  <div class="text-panels">
    <div class="text-panel" id="source-panel">
      <div class="panel-label">
        <span>🎙️ 原文 SOURCE</span>
      </div>
      <div class="panel-text placeholder" id="source-text">点击麦克风开始说话</div>
    </div>
    <div class="text-panel" id="target-panel">
      <div class="panel-label">
        <span>🔊 翻译 TRANSLATION</span>
        <button class="speak-btn" id="speak-btn" title="朗读翻译">🔊</button>
      </div>
      <div class="panel-text placeholder" id="target-text">翻译结果显示在这里</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status"></div>

  <!-- Mic button -->
  <div class="mic-section">
    <button class="mic-btn" id="mic-btn" title="点击说话">🎤</button>
    <div class="mic-label" id="mic-label">点击开始说话 Tap to speak</div>
  </div>

  <!-- Text input fallback -->
  <div class="text-input-bar" id="text-input-bar">
    <input type="text" id="text-input" placeholder="输入文字翻译 Type to translate..." autocomplete="off" enterkeyhint="send">
    <button class="send-btn" id="send-btn" title="发送翻译">➤</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label class="toggle-label">
      <input type="checkbox" id="auto-speak" checked>
      <span>🔊 自动朗读</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="continuous-mode">
      <span>🔄 连续模式</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="noisy-env">
      <span>📢 户外杂音</span>
    </label>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">📝 翻译记录 <span id="history-count"></span></div>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- Browser support warning (hidden by default) -->
  <div class="not-supported" id="not-supported" style="display:none">
    ❌ 您的浏览器不支持语音识别<br>
    请使用 Chrome、Edge 或 Safari 浏览器
  </div>
</div>

<!-- Token cost badge -->
<div class="cost-badge" id="cost-badge" style="display:none">
  ⚡ <span class="cost-val" id="cost-val">฿0.0000</span>
  <span id="cost-tokens">0 tokens</span>
</div>

<!-- PIN logic -->
<script>
(function(){
  const PIN = '684861';
  if (sessionStorage.getItem('nycking_auth') === '1') {
    document.getElementById('pin-screen').classList.remove('active');
    document.getElementById('translator').classList.add('active');
    return;
  }
  let code = '';
  const dots = document.querySelectorAll('#pin-dots .pin-dot');
  const pad = document.getElementById('pin-pad');

  function updateDots() {
    dots.forEach((d, i) => {
      d.classList.toggle('filled', i < code.length);
      d.classList.remove('error');
    });
  }
  function showError() {
    dots.forEach(d => { d.classList.add('error'); d.classList.remove('filled'); });
    setTimeout(() => { code = ''; updateDots(); }, 600);
  }
  function checkPin() {
    if (code === PIN) {
      sessionStorage.setItem('nycking_auth', '1');
      document.getElementById('pin-screen').classList.remove('active');
      document.getElementById('translator').classList.add('active');
    } else {
      showError();
    }
  }

  pad.addEventListener('click', (e) => {
    const key = e.target.closest('[data-key]')?.dataset.key;
    if (!key) return;
    if (key === 'del') { code = code.slice(0,-1); updateDots(); return; }
    if (key === 'clear') { code = ''; updateDots(); return; }
    if (code.length >= 6) return;
    code += key;
    updateDots();
    if (code.length === 6) setTimeout(checkPin, 200);
  });
})();
</script>

<!-- Dev mode API base -->
<script>
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    window.NYCKING_API_BASE = 'http://localhost:8080';
  }
</script>

<!-- App -->
<script type="module" src="/src/app.js?v=4"></script>
</body>
</html>
